<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Monitor frame -->
  <rect x="2" y="2" width="20" height="14" rx="1.5"/>
  <!-- Screen -->
  <rect x="4" y="4" width="16" height="10" rx="0.5"/>
  <!-- Stand -->
  <line x1="8" y1="16" x2="8" y2="19"/>
  <line x1="16" y1="16" x2="16" y2="19"/>
  <line x1="6" y1="19" x2="18" y2="19"/>
  <!-- 6502 chip on screen -->
  <text x="12" y="11" text-anchor="middle" font-size="5" font-family="monospace" fill="currentColor" stroke="none">6502</text>
</svg>
